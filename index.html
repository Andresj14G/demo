<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Distancia entre dos puntos de la Tierra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Distancia entre dos puntos de la Tierra</h1>
<p class="sub">Compara tres métodos: Haversine, ley esférica de cosenos y Vincenty (elipsoide WGS-84).</p>
<div class="grid">
<section class="card" aria-label="Datos de entrada">
<fieldset><legend class="a">Punto A</legend>
<label for="pa">Ciudad predefinida</label><select id="pa"></select>
<div class="row"><div><label for="la">Latitud (°)</label><input id="la" type="number" step="any"></div><div><label for="oa">Longitud (°)</label><input id="oa" type="number" step="any"></div></div></fieldset>
<fieldset><legend class="b">Punto B</legend>
<label for="pb">Ciudad predefinida</label><select id="pb"></select>
<div class="row"><div><label for="lb">Latitud (°)</label><input id="lb" type="number" step="any"></div><div><label for="ob">Longitud (°)</label><input id="ob" type="number" step="any"></div></div></fieldset>
<p class="err" id="err" role="alert"></p>
<code>Latitud: −90 a 90. Longitud: −180 a 180. Sur y oeste son negativos.</code>
</section>
<section class="card" aria-label="Resultados">
<div class="wrap"><svg id="map" viewBox="0 0 720 360" role="img" aria-label="Mapa con el arco de círculo máximo entre A y B"></svg></div>
<div class="wrap"><table>
<thead><tr><th>Método</th><th class="n">Distancia (km)</th><th class="n">Diferencia vs. Vincenty</th></tr></thead>
<tbody id="tb"></tbody></table></div>
<div class="kv" id="kv"></div>
</section>
</div>
</main>
<script src="script.js"></script>
</body>
</html>
